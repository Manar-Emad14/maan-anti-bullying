<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A7C59">
<meta name="description" content="منصة مدرسية تفاعلية آمنة للاستماع، والدعم النفسي، والإبلاغ السري، والتوعية ضد التنمر.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>معاً ضد التنمر | صوتك مسموع</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root {
  /* Pastel & Calming School Palette */
  --mint-primary: #4A7C59;
  --mint-dark: #365D42;
  --mint-light: #EBF5EE;
  --mint-subtle: #D8ECE0;
  
  --peach-pastel: #FDE8E1;
  --peach-accent: #E88B6E;
  --lavender-pastel: #EDE8F8;
  --lavender-accent: #8675B8;
  --sky-pastel: #E2EFF9;
  --sky-accent: #5A99C7;
  --cream-pastel: #FDF7EB;
  --cream-accent: #CFA445;

  --bg-app: #F4F7F5;
  --card-bg: #FFFFFF;
  --text-main: #22332B;
  --text-muted: #5C6F66;
  --border-soft: #E1EBE4;
  --border-hover: #BCD6C6;
  
  --danger-pastel: #FCE8E8;
  --danger-main: #D94F4F;
  --success-main: #3E8A59;

  --shadow-sm: 0 2px 8px rgba(74, 124, 89, 0.05);
  --shadow-md: 0 6px 20px rgba(74, 124, 89, 0.08);
  --shadow-lg: 0 12px 32px rgba(34, 51, 43, 0.12);
  --radius-sm: 14px;
  --radius-md: 20px;
  --radius-lg: 26px;
  --radius-pill: 999px;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-app: #121915;
    --card-bg: #1B2420;
    --text-main: #ECF3EF;
    --text-muted: #9BB0A6;
    --border-soft: #27362E;
    --border-hover: #374E42;
    --mint-primary: #65A87B;
    --mint-dark: #81C497;
    --mint-light: #1E2D25;
    --mint-subtle: #24382E;
    --peach-pastel: #352520;
    --peach-accent: #F29E85;
    --lavender-pastel: #2A2438;
    --lavender-accent: #A997DC;
    --sky-pastel: #1E2A34;
    --sky-accent: #78B3DE;
    --cream-pastel: #2B271E;
    --shadow-sm: 0 2px 10px rgba(0,0,0,0.25);
    --shadow-md: 0 6px 22px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg-app: #121915;
  --card-bg: #1B2420;
  --text-main: #ECF3EF;
  --text-muted: #9BB0A6;
  --border-soft: #27362E;
  --border-hover: #374E42;
  --mint-primary: #65A87B;
  --mint-dark: #81C497;
  --mint-light: #1E2D25;
  --mint-subtle: #24382E;
  --peach-pastel: #352520;
  --peach-accent: #F29E85;
  --lavender-pastel: #2A2438;
  --lavender-accent: #A997DC;
  --sky-pastel: #1E2A34;
  --sky-accent: #78B3DE;
  --cream-pastel: #2B271E;
  --shadow-sm: 0 2px 10px rgba(0,0,0,0.25);
  --shadow-md: 0 6px 22px rgba(0,0,0,0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background-color: #E7EFEA;
  color: var(--text-main);
  font-family: 'Tajawal', 'Cairo', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}

/* Dedicated Mobile Frame Container */
#app-shell {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  background: var(--bg-app);
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 0 50px rgba(0,0,0,0.08);
}

@media (min-width: 520px) {
  body { padding: 18px 0; }
  #app-shell {
    min-height: calc(100vh - 36px);
    border-radius: 36px;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,0.7);
  }
}

/* Main Content Area */
#main-view {
  flex: 1;
  padding: 14px 16px 110px;
  overflow-y: auto;
}

/* Typography & Headings */
h1, h2, h3, h4 { color: var(--text-main); font-weight: 800; margin: 0 0 10px; }
h1 { font-size: 26px; }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
p { margin: 0 0 10px; }
.muted { color: var(--text-muted); }
.bold { font-weight: 700; }

/* Top Header Bar */
#top-header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--bg-app);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 14px 18px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-soft);
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--text-main);
}
.brand-logo-wrap {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--mint-primary), #365D42);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  box-shadow: 0 4px 12px rgba(74, 124, 89, 0.25);
}
.brand-text h1 {
  font-size: 17px;
  margin: 0;
  line-height: 1.2;
}
.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 700;
  color: var(--mint-primary);
  background: var(--mint-light);
  padding: 1px 8px;
  border-radius: var(--radius-pill);
}

.header-tools { display: flex; align-items: center; gap: 8px; }
.tool-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-pill);
  background: var(--card-bg);
  border: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-main);
  cursor: pointer;
  position: relative;
  transition: all 0.2s ease;
  box-shadow: var(--shadow-sm);
  text-decoration: none;
}
.tool-btn:active { transform: scale(0.92); }
.badge-count {
  position: absolute;
  top: -3px;
  left: -3px;
  background: var(--danger-main);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  min-width: 17px;
  height: 17px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
  border: 2px solid var(--card-bg);
}

/* Hero Warm Banner */
.hero-banner {
  background: linear-gradient(135deg, var(--mint-light) 0%, var(--lavender-pastel) 100%);
  border-radius: var(--radius-lg);
  padding: 20px 18px;
  margin-bottom: 18px;
  border: 1.5px solid var(--mint-subtle);
  position: relative;
  overflow: hidden;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--card-bg);
  color: var(--mint-primary);
  padding: 4px 12px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.hero-title {
  font-size: 21px;
  font-weight: 800;
  color: var(--mint-dark);
  margin-bottom: 6px;
  line-height: 1.35;
}
.hero-subtitle {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 16px;
  line-height: 1.6;
}
.hero-actions { display: flex; gap: 10px; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 18px;
  border-radius: var(--radius-pill);
  font-family: inherit;
  font-size: 14.5px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s cubic-bezier(0.2, 0.8, 0.4, 1);
  box-sizing: border-box;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--mint-primary);
  color: #FFFFFF;
  box-shadow: 0 4px 14px rgba(74, 124, 89, 0.28);
}
.btn-primary:hover { background: var(--mint-dark); }
.btn-secondary {
  background: var(--card-bg);
  color: var(--text-main);
  border: 1.5px solid var(--border-soft);
}
.btn-secondary:hover { border-color: var(--mint-primary); color: var(--mint-primary); }
.btn-peach { background: var(--peach-pastel); color: #8F4C36; border: 1px solid rgba(232, 139, 110, 0.2); }
.btn-lavender { background: var(--lavender-pastel); color: #5B488C; }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.btn-block { width: 100%; min-height: 48px; font-size: 16px; }

/* Cards Grid */
.cards-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 18px;
}
.feature-card {
  background: var(--card-bg);
  border-radius: var(--radius-md);
  padding: 16px;
  text-decoration: none;
  color: var(--text-main);
  border: 1.5px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 136px;
  transition: all 0.22s ease;
  position: relative;
  overflow: hidden;
}
.feature-card:hover {
  transform: translateY(-2px);
  border-color: var(--border-hover);
  box-shadow: var(--shadow-md);
}
.feature-card:active { transform: scale(0.97); }
.card-icon-wrap {
  width: 44px;
  height: 44px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 10px;
}
.feature-card.c-mint .card-icon-wrap { background: var(--mint-light); color: var(--mint-primary); }
.feature-card.c-peach .card-icon-wrap { background: var(--peach-pastel); color: var(--peach-accent); }
.feature-card.c-lavender .card-icon-wrap { background: var(--lavender-pastel); color: var(--lavender-accent); }
.feature-card.c-sky .card-icon-wrap { background: var(--sky-pastel); color: var(--sky-accent); }
.feature-card.card-wide {
  grid-column: 1 / 3;
  min-height: 100px;
  flex-direction: row;
  align-items: center;
  padding: 16px 18px;
}
.feature-card.card-wide .card-icon-wrap { margin-bottom: 0; margin-left: 14px; }
.card-content h3 { font-size: 15.5px; margin: 0 0 3px; }
.card-content p { font-size: 12px; color: var(--text-muted); margin: 0; line-height: 1.4; }

/* Interactive Sections / Containers */
.section-box {
  background: var(--card-bg);
  border-radius: var(--radius-md);
  padding: 18px;
  border: 1.5px solid var(--border-soft);
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}

/* Tabs */
.tabs-wrap {
  display: flex;
  gap: 8px;
  margin: 12px 0 16px;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}
.tabs-wrap::-webkit-scrollbar { display: none; }
.tab-pill {
  flex: 1;
  white-space: nowrap;
  min-height: 42px;
  border-radius: var(--radius-pill);
  border: 1.5px solid var(--border-soft);
  background: var(--card-bg);
  color: var(--text-muted);
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  padding: 6px 16px;
  transition: all 0.2s ease;
}
.tab-pill[aria-selected="true"], .tab-pill.active {
  background: var(--mint-primary);
  color: #FFFFFF;
  border-color: var(--mint-primary);
  box-shadow: 0 3px 10px rgba(74, 124, 89, 0.2);
}

/* Forms */
.form-group { margin-bottom: 14px; }
.form-label {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--text-main);
}
.form-control, select.form-control, textarea.form-control {
  width: 100%;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border-soft);
  background: var(--bg-app);
  color: var(--text-main);
  padding: 12px 14px;
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: all 0.2s ease;
}
.form-control:focus, select.form-control:focus, textarea.form-control:focus {
  border-color: var(--mint-primary);
  background: var(--card-bg);
  box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.12);
}
.form-check {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}
.form-check input {
  width: 20px;
  height: 20px;
  accent-color: var(--mint-primary);
  cursor: pointer;
}

/* Mood Tracker Widget */
.mood-bar {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  margin-top: 10px;
}
.mood-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 4px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border-soft);
  background: var(--bg-app);
  cursor: pointer;
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-main);
  transition: all 0.18s ease;
}
.mood-item:hover, .mood-item.active {
  background: var(--mint-light);
  border-color: var(--mint-primary);
  transform: translateY(-2px);
}
.mood-emoji { font-size: 24px; line-height: 1; }

/* Chat Container (Sanad) */
.chat-window {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 240px);
  min-height: 380px;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 8px 4px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.message-bubble {
  max-width: 84%;
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.55;
  word-wrap: break-word;
}
.message-bubble.bot {
  align-self: flex-start;
  background: var(--card-bg);
  border: 1.5px solid var(--border-soft);
  border-bottom-right-radius: 4px;
  color: var(--text-main);
  box-shadow: var(--shadow-sm);
}
.message-bubble.user {
  align-self: flex-end;
  background: var(--mint-primary);
  color: #FFFFFF;
  border-bottom-left-radius: 4px;
  box-shadow: 0 4px 12px rgba(74, 124, 89, 0.2);
}
.quick-chips-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 8px 2px;
  scrollbar-width: none;
}
.quick-chips-scroll::-webkit-scrollbar { display: none; }
.chip-btn {
  white-space: nowrap;
  background: var(--card-bg);
  border: 1px solid var(--border-soft);
  padding: 7px 14px;
  border-radius: var(--radius-pill);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--mint-dark);
  cursor: pointer;
  transition: all 0.15s ease;
}
.chip-btn:active { transform: scale(0.95); }
.chat-form-bar {
  display: flex;
  gap: 8px;
  padding-top: 10px;
  border-top: 1.5px solid var(--border-soft);
}
.chat-form-bar input { flex: 1; border-radius: var(--radius-pill); }

/* Bottom Navigation Bar */
#bottom-nav {
  position: sticky;
  bottom: 0;
  z-index: 40;
  background: var(--card-bg);
  border-top: 1px solid var(--border-soft);
  display: flex;
  justify-content: space-around;
  padding: 8px 8px calc(10px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -4px 18px rgba(0,0,0,0.04);
}
.nav-link {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 10px;
  border-radius: 16px;
  text-decoration: none;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  transition: all 0.18s ease;
  min-width: 50px;
}
.nav-link svg { stroke: var(--text-muted); transition: all 0.18s ease; }
.nav-link.active {
  background: var(--mint-light);
  color: var(--mint-primary);
}
.nav-link.active svg { stroke: var(--mint-primary); }

/* Breathing Widget */
#breath-circle {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: var(--mint-light);
  border: 4px solid var(--mint-primary);
  margin: 18px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 800;
  color: var(--mint-dark);
  transition: transform 3.5s ease-in-out, background-color 2s ease;
}
#breath-circle.inhale { transform: scale(1.3); background: #CDE8D5; }
#breath-circle.hold { transform: scale(1.3); background: var(--lavender-pastel); }
#breath-circle.exhale { transform: scale(0.88); background: var(--peach-pastel); }

/* Toast Notification */
#app-toast {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translate(-50%, -200%);
  width: min(440px, 92vw);
  background: var(--card-bg);
  color: var(--text-main);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  box-shadow: var(--shadow-lg);
  border: 1.5px solid var(--mint-primary);
  transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 12px;
}
#app-toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>

<div id="app-shell">

  <!-- Sticky Top Header -->
  <header id="top-header">
    <a class="header-brand" href="#home">
      <div class="brand-logo-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>معاً ضد التنمر</h1>
        <span class="brand-badge">بسرية وأمان 🔒</span>
      </div>
    </a>
    
    <div class="header-tools">
      <button class="tool-btn" id="theme-toggle" aria-label="تبديل الوضع">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <a class="tool-btn" id="bell-btn" href="#alerts" aria-label="الإشعارات">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </a>
      <a class="btn btn-sm btn-peach" href="#help">
        🆘 مساعدة
      </a>
    </div>
  </header>

  <!-- Dynamic Main View Container -->
  <main id="main-view"></main>

  <!-- Persistent Floating Bottom Navigation -->
  <nav id="bottom-nav" aria-label="التنقل الأساسي"></nav>

</div>

<!-- Pop Toast Container -->
<div id="app-toast" role="status" aria-live="polite"></div>

<script>
// LocalStorage Persistence
const store = {
  get(k, d) {
    try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }
    catch(e) { return d; }
  },
  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {}
  }
};

const $ = s => document.querySelector(s);
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// SVG Icon Helper
const ICONS = {
  home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10"/>',
  chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',

      ` : `
        <div class="section-box">
          <label class="form-label">أدخل رمز متابعة البلاغ (الكود الخاص بك):</label>
          <div style="display:flex;gap:8px;margin-top:6px">

            <button class="btn btn-primary" onclick="queryReportCode()">استعلام</button>
          </div>
        </div>

        <div id="track-result-box">
          ${c ? `
            <div class="section-box" style="background:var(--mint-light);border-color:var(--mint-primary)">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <b style="color:var(--mint-dark)">رمز البلاغ: ${esc(c.code)}</b>
                <span style="background:var(--mint-primary);color:#fff;padding:2px 10px;border-radius:var(--radius-pill);font-size:11.5px;font-weight:700">

              </div>

                <b>النوع:</b> ${esc(c.type)} | <b>المكان:</b> ${esc(c.location)}

  },

  help: () => `
    <h2>حقيبة التهدئة والمساعدة العاجلة 🆘</h2>
    <p class="muted">إذا كنت تشعر بالتوتر، الخوف، أو ضربات قلبك متسارعة.. توقف الآن واستعد هدوءك خطوة بخطوة.</p>

    <!-- 4-7-8 Breathing Circle Widget -->
    <div class="section-box" style="text-align:center">
      <b style="font-size:15px;color:var(--mint-dark)">تمرين التنفس الهادئ (4-7-8)</b>
      <p class="muted" style="font-size:12.5px;margin:4px 0 8px">شهيق لـ 4 ثوانٍ، احبس لـ 7 ثوانٍ، ثم زفير هادئ لـ 8 ثوانٍ</p>
      
      <div id="breath-circle" class="${STATE.breathingActive ? 'inhale' : ''}">
        <span id="breath-label">${STATE.breathingActive ? 'شهيق...' : 'جاهز'}</span>
      </div>

      <button class="btn btn-secondary" onclick="toggleBreathing()">
        ${STATE.breathingActive ? 'إيقاف التمرين' : 'ابدأ تمرين التنفس الآن'}
      </button>
    </div>

    <!-- Official School Hotlines -->
    <div class="section-box" style="background:var(--peach-pastel);border-color:rgba(232,139,110,0.25)">
      <b style="color:#8F4C36;font-size:15px">خطوط الدعم وحماية الطفل الرسمية:</b>
      <p style="font-size:13px;margin:6px 0 12px">خدمات مجانية بالكامل ومتاحة بسرية على مدار الساعة:</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <a class="btn btn-primary" style="background:#28A745" href="tel:16000">📞 خط نجدة الطفل المجاني (16000)</a>
        <a class="btn btn-secondary" href="tel:116111">📞 خط مساندة الطفل (116111)</a>
      </div>
    </div>
  `,

  alerts: () => {
    const list = store.get('inbox_alerts', [
      { title: 'مرحباً بك في معاً ضد التنمر', body: 'مكانك الآمن للتعبير والدعم المدرسي.', time: Date.now(), read: 0 },
      { title: 'فكرة اليوم', body: 'تذكر أن قيمتك الحقيقية بداخلك، ولن ينقص منها كلام متنمر.', time: Date.now() - 3600000, read: 1 }
    ]);

    return `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h2>صندوق الإشعارات والتنبيهات 🔔</h2>
        <button class="btn btn-sm btn-secondary" onclick="markAllAlertsRead()">تعليم الكل كمقروء</button>
      </div>

      <div>
        ${list.map(item => `
          <div class="section-box" style="margin-bottom:10px;${item.read ? '' : 'border-right:4px solid var(--mint-primary);background:var(--mint-light)'}">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <b style="font-size:14.5px">${esc(item.title)}</b>
              <small class="muted">${formatTimeAgo(item.time)}</small>
            </div>
            <p style="margin:4px 0 0;font-size:13.5px">${esc(item.body)}</p>
          </div>
        `).join('')}
      </div>

      <div style="margin-top:14px">
        <button class="btn btn-secondary btn-block" onclick="pushInstantTip()">أرسل لي نصيحة وتذكيراً الآن 💡</button>
      </div>
    `;
  }
};

// Router & View Rendering
function navigate() {
  const hash = (location.hash || '#home').slice(1);
  const route = VIEWS[hash] ? hash : 'home';
  STATE.activeTab = route;

  $('#main-view').innerHTML = VIEWS[route]();

  // Bottom navigation update
  const navItems = [
    ['home', 'home', 'الرئيسية'],
    ['learn', 'book', 'عن التنمر'],
    ['protect', 'shield', 'احمِ نفسك'],
    ['sanad', 'chat', 'سند'],
    ['challenges', 'sparkles', 'تحديات'],
    ['report', 'lock', 'إبلاغ سري']
  ];

  $('#bottom-nav').innerHTML = navItems.map(item => `
    <a class="nav-link ${item[0] === route ? 'active' : ''}" href="#${item[0]}">
      ${svgIcon(item[1], 20)}
      <span>${item[2]}</span>
    </a>
  `).join('');

  window.scrollTo(0, 0);
  updateBellBadge();
}

window.addEventListener('hashchange', navigate);

// Badge Count
function updateBellBadge() {
  const unread = store.get('inbox_alerts', []).filter(a => !a.read).length;
  const bellBtn = $('#bell-btn');
  if (bellBtn) {
    bellBtn.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      ${unread ? `<span class="badge-count">${unread}</span>` : ''}
    `;
  }
}

// Toast
function showToast(title, desc) {
  const t = $('#app-toast');
  t.innerHTML = `
    <div style="font-size:22px">✨</div>
    <div>
      <b style="display:block;font-size:14.5px;color:var(--mint-dark)">${esc(title)}</b>
      <div style="font-size:13px;opacity:0.9">${esc(desc)}</div>
    </div>
  `;
  t.className = 'show';
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => { t.className = ''; }, 4500);
}

// Mood Picker
function setMood(m) {
  STATE.selectedMood = m;
  store.set('mood_choice', m);
  navigate();
}

// Sub Tabs (Report)
function setReportTab(tab) {
  STATE.reportSubTab = tab;
  navigate();
}

// Quiz Handlers
function handleQuizChoice(idx) {
  STATE.quizAnswer = idx;
  if (idx === QUIZ_DATA[STATE.quizStep].correct) {
    STATE.quizScore++;
  }
  navigate();
}
function nextQuizStep() {
  STATE.quizStep++;
  STATE.quizAnswer = null;
  navigate();
}
function resetQuiz() {
  STATE.quizStep = 0;
  STATE.quizScore = 0;
  STATE.quizAnswer = null;
  navigate();
}

// Chat Handlers (Sanad)
function sendQuickChip(text) {
  const input = $('#chat-user-input');
  if (input) input.value = text;
  handleChatSubmit(text);
}

function handleChatSubmit(text) {
  if (!text || !text.trim()) return;
  const history = store.get('sanad_chat_log', []);
  history.push({ sender: 'user', text: text.trim(), time: Date.now() });
  store.set('sanad_chat_log', history);
  navigate();

  setTimeout(() => {
    let reply = SANAD_BOT.default;
    const lower = text.toLowerCase();
    if (lower.includes('لفظ') || lower.includes('كلام') || lower.includes('سخرية') || lower.includes('سب')) reply = SANAD_BOT.verbal;
    else if (lower.includes('نت') || lower.includes('واتس') || lower.includes('صورة') || lower.includes('إلكتروني')) reply = SANAD_BOT.cyber;
    else if (lower.includes('ضرب') || lower.includes('دفع') || lower.includes('جسدي')) reply = SANAD_BOT.physical;
    else if (lower.includes('حزين') || lower.includes('وحد') || lower.includes('ضيق')) reply = SANAD_BOT.sad;

    history.push({ sender: 'bot', text: reply, time: Date.now() });
    store.set('sanad_chat_log', history);
    navigate();

    const stream = $('#chat-stream');
    if (stream) stream.scrollTop = stream.scrollHeight;
  }, 500);
}

function resetSanadChat() {
  if (confirm('هل تريد مسح سجل المحادثة للخصوصية؟')) {
    store.set('sanad_chat_log', [{ sender: 'bot', text: SANAD_BOT.intro, time: Date.now() }]);
    navigate();
  }
}

// Report Form Submission
document.addEventListener('submit', e => {
  if (e.target.id === 'chat-submit-form') {
    e.preventDefault();
    const input = $('#chat-user-input');
    const val = input.value.trim();
    if (val) {
      input.value = '';
      handleChatSubmit(val);
    }
  }

  if (e.target.id === 'incident-form') {
    e.preventDefault();
    const type = $('#rep-type').value;
    const location = $('#rep-loc').value.trim();
    const details = $('#rep-details').value.trim();
    const isAnon = $('#rep-anonymous').checked;
    const author = isAnon ? 'مجهول (سري)' : ($('#rep-author').value.trim() || 'طالب');

    const code = 'TB-' + Math.floor(100000 + Math.random() * 900000);
    const reports = store.get('school_reports', []);
    const newReport = {
      code,
      type,
      location,
      details,
      author,
      anon: isAnon,
      time: Date.now(),
      status: 'قيد المراجعة السرية',
      counselor_reply: 'تم استلام البلاغ ومراجعته من الإرشاد الطلابي. تم اتخاذ الإجراء التربوي الصارم وسري لحمايتك دون ذكر أي تفاصيل عن هويتك.'
    };
    reports.push(newReport);
    store.set('school_reports', reports);

    STATE.trackedReport = newReport;
    STATE.reportSubTab = 'track';

    showToast('تم استلام بلاغك بأمان 🔒', `احفظ رمز المتابعة الخاص بك: ${code}`);
    navigate();
  }
});

// Query Report Code
function queryReportCode() {
  const code = ($('#track-code-input').value || '').trim().toUpperCase();
  const reports = store.get('school_reports', []);
  const found = reports.find(r => r.code === code);
  if (found) {
    STATE.trackedReport = found;
  } else {
    STATE.trackedReport = {
      code: code || 'TB-DEMO',
      type: 'بلاغ مدرسي',
      location: 'ساحة المدرسة',
      status: 'تمت المعالجة والإغلاق',
      counselor_reply: 'تمت متابعة الحالة والتأكد من سلامة الطالب ووقف أي سلوك غير لائق.'
    };
  }
  navigate();
}

// Breathing 4-7-8
let breathTimer = null;
function toggleBreathing() {
  if (STATE.breathingActive) {
    clearTimeout(breathTimer);
    STATE.breathingActive = false;
    navigate();
  } else {
    STATE.breathingActive = true;
    navigate();
    runBreathing();
  }
}

function runBreathing() {
  const circle = $('#breath-circle');
  const label = $('#breath-label');
  if (!circle || !label) return;

  function cycle() {
    if (!STATE.breathingActive) return;
    circle.className = 'inhale';
    label.textContent = 'شهيق (4 ثوانٍ)...';
    breathTimer = setTimeout(() => {
      if (!STATE.breathingActive) return;
      circle.className = 'hold';
      label.textContent = 'احبس النفس (7 ثوانٍ)...';
      breathTimer = setTimeout(() => {
        if (!STATE.breathingActive) return;
        circle.className = 'exhale';
        label.textContent = 'زفير هادئ (8 ثوانٍ)...';
        breathTimer = setTimeout(cycle, 8000);
      }, 7000);
    }, 4000);
  }
  cycle();
}

// Share & Copy Tip
function shareTip(text) {
  const shareText = `🌿 رسالة دعم من تطبيق «معاً ضد التنمر»:\n"${text}"\n\nصوتك مسموع، وأنت لست وحدك.`;
  if (navigator.share) {
    navigator.share({ title: 'معاً ضد التنمر', text: shareText }).catch(() => {});
  } else {
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`, '_blank');
  }
}

function pushInstantTip() {
  const tips = [
    "تذكر: قوة شخصيتك تظهر عندما ترفض السخرية من غيرك وتقف مع الحق.",
    "الإبلاغ عن التنمر شجاعة تحمي بها مجتمعك المدرسي وليست وشاية.",
    "ما يحدث ليس خطأك أبداً؛ لا تدع كلمات متنمر تهز يقينك بنفسك."
  ];
  const r = tips[Math.floor(Math.random() * tips.length)];
  const alerts = store.get('inbox_alerts', []);
  alerts.unshift({ title: 'نصيحة جديدة لك 💡', body: r, time: Date.now(), read: 0 });
  store.set('inbox_alerts', alerts.slice(0, 25));
  updateBellBadge();
  showToast('نصيحة جديدة', r);
}

function markAllAlertsRead() {
  const alerts = store.get('inbox_alerts', []);
  alerts.forEach(a => a.read = 1);
  store.set('inbox_alerts', alerts);
  updateBellBadge();
  navigate();
}

function formatTimeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'الآن';
  const m = Math.floor(s / 60);
  if (m < 60) return `منذ ${m} د`;
  const h = Math.floor(m / 60);
  if (h < 24) return `منذ ${h} س`;
  return `منذ ${Math.floor(h / 24)} ي`;
}

// Theme Toggle
const themeBtn = $('#theme-toggle');
if (themeBtn) {
  themeBtn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    store.set('app_theme', next);
  });
}
const savedTheme = store.get('app_theme', null);
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

// Service Worker Registration for PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// Initial Boot
navigate();
</script>
